<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - تطبيق الذكريات</title>
    <!-- استدعاء إطار Bootstrap لتصميم متجاوب -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white text-center py-3">
                        <h4 class="mb-0">تسجيل الدخول</h4>
                    </div>
                    <div class="card-body p-4">
                        
                        <!-- عرض رسائل الخطأ من الخادم إن وجدت -->
                        {% if error %}
                        <div class="alert alert-danger text-center">{{ error }}</div>
                        {% endif %}

                        <!-- عرض رسالة آخر تسجيل دخول من الـ Cookie -->
                        {% if request.cookies.get('lastLoginDate') %}
                        <div class="alert alert-info text-center">
                            <small>Last login from this computer was [{{ request.cookies.get('lastLoginDate') }}]</small>
                        </div>
                        {% endif %}

                        <!-- نموذج تسجيل الدخول -->
                        <form action="/login" method="POST">
                            <div class="mb-3">
                                <label for="email" class="form-label">البريد الإلكتروني</label>
                                <!-- التحقق من المدخلات عبر HTML5 (required و type="email") -->
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label">كلمة المرور</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">دخول</button>
                            </div>
                        </form>
                    </div>
                    <div class="card-footer text-center py-3 bg-white">
                        <small class="text-muted">ليس لديك حساب؟ <a href="/register" class="text-decoration-none">سجل الآن</a></small>
                    </div>
                </div>
                
                <!-- زر العودة للصفحة الرئيسية -->
                <div class="text-center mt-3">
                    <a href="/" class="text-decoration-none text-secondary">العودة للصفحة الرئيسية</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
