<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل الملف الشخصي - تطبيق الذكريات</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #f4f7f6; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">العودة للمعرض</a>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">تعديل بيانات الحساب</h5>
                    </div>
                    <div class="card-body p-4">
                        <form action="/profile/edit" method="POST">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">الاسم الأول</label>
                                    <input type="text" class="form-control" name="first_name" value="{{ user.first_name }}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">الاسم الأخير</label>
                                    <input type="text" class="form-control" name="last_name" value="{{ user.last_name }}" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">المهنة</label>
                                <input type="text" class="form-control" name="occupation" value="{{ user.occupation or '' }}">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">الموقع (المدينة/الدولة)</label>
                                <input type="text" class="form-control" name="location" value="{{ user.location or '' }}">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">نبذة شخصية</label>
                                <textarea class="form-control" name="description" rows="3">{{ user.description or '' }}</textarea>
                            </div>

                            <hr class="my-4">
                            
                            <div class="mb-4">
                                <label class="form-label text-danger">تغيير كلمة المرور (اختياري)</label>
                                <input type="password" class="form-control" name="password" placeholder="اترك الحقل فارغاً إذا لم ترد تغييرها">
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                                <a href="/" class="btn btn-secondary me-md-2">إلغاء</a>
                                <button type="submit" class="btn btn-primary">حفظ التعديلات</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
